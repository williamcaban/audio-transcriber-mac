name: Release

# Manual-only: deliberately not wired to tag-push or push-to-main. This app's
# feature set isn't settled yet, so publishing a signed, notarized build
# should be a deliberate choice each time, not automatic.
on:
  workflow_dispatch:

# Required for `gh release create` to work with the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both v0.1.0 and v0.1.1 built, signed, and notarized successfully
      # while silently missing MLX's compiled default.metallib (no build
      # error at all), crashing on launch with "MLX error: Failed to load
      # the default metallib" -- none of codesign/notarize touches whether
      # the metallib was ever produced. Downloading Xcode's separate Metal
      # Toolchain component alone didn't fix it (verified on a real run);
      # scripts/bundle-app.sh now also forces the "swiftbuild" build engine
      # explicitly, the other candidate explanation. Kept as a prerequisite
      # regardless -- see that script's comment for the details and current
      # confidence level on each.
      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build .app bundle
        run: ./scripts/bundle-app.sh

      # Catches exactly the v0.1.0 failure mode before signing/notarizing/
      # publishing a broken build: codesigning and notarization both
      # succeeded for it since neither touches whether the app actually
      # runs.
      - name: Launch smoke test
        run: |
          "dist/Audio Transcriber.app/Contents/MacOS/AudioTranscriberMac" > launch.log 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "App exited within 5s of launching:"
            cat launch.log
            exit 1
          fi
          kill $PID

      # A fresh, temporary keychain rather than the runner's default/login
      # keychain, so the imported certificate and its unlock password don't
      # persist beyond this job. The signing identity string itself (e.g.
      # "Developer ID Application: William Caban (TEAMID)") is derived from
      # the imported cert via `security find-identity` rather than taken as
      # its own secret -- one less value to keep in sync if the cert is ever
      # renewed.
      - name: Import Developer ID signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -n 's/.*"\(.*\)".*/\1/p')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No 'Developer ID Application' identity found in the imported certificate." >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      # A single `--deep` sign of the whole app, rather than pre-signing the
      # main executable and nested items separately -- confirmed via a real
      # failed run, not guessed: pre-signing the executable while
      # scripts/bundle-app.sh's colocated mlx.metallib (see that script's
      # comment for why it's there) sits next to it makes codesign treat the
      # metallib as an unsigned "subcomponent" and reject the whole bundle,
      # even though it's just a resource with no Mach-O in it. `--deep`
      # signs any genuinely nested code (dylibs/frameworks, none currently)
      # and seals everything else, including that metallib, as part of the
      # app's own single signature instead, which plain ad-hoc testing
      # locally confirmed works end to end (valid signature, and the app
      # actually launches instead of exiting immediately). Hardened Runtime
      # is required for notarization; see
      # scripts/AudioTranscriberMac.entitlements for why
      # disable-library-validation is also needed, given MLX's own compiled
      # binaries are ad-hoc-signed by a plain `swift build`.
      - name: Code sign app bundle
        run: |
          set -euo pipefail
          APP="dist/Audio Transcriber.app"

          codesign --force --deep --options runtime --timestamp \
            --entitlements scripts/AudioTranscriberMac.entitlements \
            --sign "$SIGNING_IDENTITY" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize app
        env:
          APPLE_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          # NOTARY_API_KEY_P8 (unlike MACOS_CERT_P12_BASE64) holds the raw
          # PEM text directly, not base64 -- confirmed via a real
          # notarytool "invalidPrivateKeyContents" failure after
          # base64-decoding it. A .p8 key is already plain ASCII, so storing
          # it as-is needs no encoding; handle a base64-encoded value too in
          # case that ever changes.
          if [[ "$APPLE_API_KEY_P8" == -----BEGIN* ]]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          else
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi

          ditto -c -k --keepParent "dist/Audio Transcriber.app" "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait

          xcrun stapler staple "dist/Audio Transcriber.app"

      - name: Package stapled app
        run: ditto -c -k --keepParent "dist/Audio Transcriber.app" "dist/Audio-Transcriber-macOS.zip"

      # Tags/publishes from the version already in scripts/Info.plist rather
      # than taking one as a workflow input -- bumping that file is a
      # separate, deliberate step before dispatching this workflow, not
      # something this workflow should decide on its own.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" scripts/Info.plist)
          gh release create "v${VERSION}" "dist/Audio-Transcriber-macOS.zip" \
            --title "v${VERSION}" \
            --generate-notes
