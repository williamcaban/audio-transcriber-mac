name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
          swift build --help | grep -A4 -- '--build-system'
      # Xcode 26+ ships the Metal shader compiler as a separate, on-demand
      # component rather than bundled by default. This alone turned out NOT
      # to fix MLX's Metal kernels silently failing to compile into
      # default.metallib (verified on a real run: this step succeeded, the
      # metallib was still missing) -- kept anyway since mlx-swift's own CI
      # explicitly checks for it the same way
      # (`xcodebuild -showComponent MetalToolchain`) and it's a legitimate
      # prerequisite regardless. The `--build-system swiftbuild` flag below
      # is the next (also unconfirmed-on-CI) hypothesis: this machine's
      # Swift 6.4 defaults `swift build` to the newer "swiftbuild" engine,
      # which does compile the kernels; CI's Swift 6.3.3 may default to the
      # legacy "native" engine, which doesn't.
      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: swift build --build-system swiftbuild -v
      - name: Build .app bundle
        run: ./scripts/bundle-app.sh
      - name: Verify .app bundle structure
        run: |
          APP="dist/Audio Transcriber.app"
          test -f "$APP/Contents/MacOS/AudioTranscriberMac"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/MacOS/mlx.metallib"
          plutil -lint "$APP/Contents/Info.plist"
      # The structure check above only proves the files exist -- this
      # actually launches the app and confirms it doesn't immediately exit,
      # which is exactly the failure mode a missing Metal toolchain (or any
      # other startup crash) causes and the structure check alone can't
      # catch.
      - name: Launch smoke test
        run: |
          "dist/Audio Transcriber.app/Contents/MacOS/AudioTranscriberMac" > launch.log 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "App exited within 5s of launching:"
            cat launch.log
            exit 1
          fi
          kill $PID
